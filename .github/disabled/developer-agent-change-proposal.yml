name: Developer Agent - Change Proposal

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  developer-agent:
    runs-on: ubuntu-latest

    environment: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OpenAI SDK
        run: |
          pip install openai

      - name: Collect repository context
        run: |
          mkdir context

          find . \
            -type f \
            ! -path "./.git/*" \
            ! -path "./node_modules/*" \
            ! -path "./dist/*" \
            | sort \
            > context/repository-files.txt

          head -200 context/repository-files.txt > context/repository-files-short.txt

          if [ -f README.md ]; then
            head -200 README.md > context/readme.txt
          fi

      - name: Generate change proposal
        env:
          FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_ENDPOINT }}
          FOUNDRY_API_KEY: ${{ secrets.FOUNDRY_API_KEY }}
          FOUNDRY_MODEL_DEPLOYMENT: ${{ secrets.FOUNDRY_MODEL_DEPLOYMENT }}

          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}

        run: |
          python <<'EOF'
          import os
          from openai import OpenAI

          client = OpenAI(
              api_key=os.environ["FOUNDRY_API_KEY"],
              base_url=os.environ["FOUNDRY_ENDPOINT"]
          )

          with open(
              "context/repository-files-short.txt",
              "r",
              encoding="utf-8"
          ) as f:
              repository_files = f.read()

          readme = ""

          if os.path.exists("context/readme.txt"):
              with open(
                  "context/readme.txt",
                  "r",
                  encoding="utf-8"
              ) as f:
                  readme = f.read()

          prompt = f"""
          You are a senior software developer.

          Analyze the GitHub issue and the repository structure.

          Your task is NOT to implement code.

          Produce a change proposal.

          Include:

          1. Summary
          2. Proposed implementation approach
          3. Files that should be modified
          4. Why those files are needed
          5. Suggested tests
          6. Risks and assumptions

          ISSUE TITLE:
          {os.environ['ISSUE_TITLE']}

          ISSUE DESCRIPTION:
          {os.environ['ISSUE_BODY']}

          REPOSITORY FILES:
          {repository_files}

          README:
          {readme}
          """

          response = client.responses.create(
              model=os.environ["FOUNDRY_MODEL_DEPLOYMENT"],
              input=prompt
          )

          proposal = response.output_text

          os.makedirs("docs", exist_ok=True)

          filename = (
              f"docs/issue-"
              f"{os.environ['ISSUE_NUMBER']}"
              f"-change-proposal.md"
          )

          with open(
              filename,
              "w",
              encoding="utf-8"
          ) as f:
              f.write("# Developer Agent Change Proposal\n\n")
              f.write(proposal)

          print(proposal)

          EOF

      - name: Configure Git
        run: |
          git config user.name "PetriDevAgent"
          git config user.email "petri.dev.agent@gmail.com"

      - name: Create branch and commit proposal
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH="devagent/issue-${ISSUE_NUMBER}"

          git checkout -b "$BRANCH"

          git add docs/

          git commit \
            -m "Developer Agent: change proposal for issue #${ISSUE_NUMBER}"

          git push origin "$BRANCH"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH="devagent/issue-${ISSUE_NUMBER}"

          gh pr create \
            --head "$BRANCH" \
            --base main \
            --title "Developer Agent: Change Proposal for Issue #${ISSUE_NUMBER}" \
            --body "
          Generated automatically by Developer Agent.

          This pull request contains:

          - Repository analysis
          - Suggested implementation approach
          - Proposed files to modify
          - Testing recommendations
          "

      - name: Comment on issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment \
            "$ISSUE_NUMBER" \
            --body \
            "🤖 Developer Agent created a change proposal and opened a pull request."