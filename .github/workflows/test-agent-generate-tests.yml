name: Test Automation Agent - Generate Tests

on:

  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to test"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  test-agent:
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Resolve pull request context
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          echo "PR_NUMBER=$PR_NUMBER"
          echo "REPOSITORY=${{ github.repository }}"

          gh pr view "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --json number,title,body,baseRefName,headRefOid,headRepository \
            > pr-context.json

          cat pr-context.json

          echo "number=$(jq -r '.number' pr-context.json)" >> "$GITHUB_OUTPUT"
          echo "title=$(jq -r '.title' pr-context.json)" >> "$GITHUB_OUTPUT"

          {
            echo "body<<EOF"
            jq -r '.body // ""' pr-context.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "base-ref=$(jq -r '.baseRefName' pr-context.json)" >> "$GITHUB_OUTPUT"
          echo "head-sha=$(jq -r '.headRefOid' pr-context.json)" >> "$GITHUB_OUTPUT"
          echo "head-repo=$(jq -r '.headRepository.nameWithOwner' pr-context.json)" >> "$GITHUB_OUTPUT"

      - name: Check PR repository
        id: repository
        run: |
          if [ "${{ steps.pr.outputs.head-repo }}" = "${{ github.repository }}" ]; then
            echo "same-repository=true" >> "$GITHUB_OUTPUT"
          else
            echo "same-repository=false" >> "$GITHUB_OUTPUT"
            echo "Fork pull requests are analyzed, but generated tests will not be pushed."
          fi

      - name: Install OpenAI SDK
        run: pip install openai==3.19.0

      - name: Collect implementation context
        run: |
          git fetch origin "${{ steps.pr.outputs.base-ref }}"
          git diff "origin/${{ steps.pr.outputs.base-ref }}...HEAD" > pr.diff
          git diff --name-only "origin/${{ steps.pr.outputs.base-ref }}...HEAD" > changed-files.txt

      - name: Generate testing decision
        env:
          FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_ENDPOINT }}
          FOUNDRY_API_KEY: ${{ secrets.FOUNDRY_API_KEY }}
          FOUNDRY_MODEL_DEPLOYMENT: ${{ secrets.FOUNDRY_MODEL_DEPLOYMENT }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_BODY: ${{ steps.pr.outputs.body }}
        run: |
          python <<'EOF'
          import json
          import os
          import re
          from openai import OpenAI

          with open("changed-files.txt", encoding="utf-8") as file:
              changed_files = file.read()

          with open("pr.diff", encoding="utf-8") as file:
              diff = file.read()

          client = OpenAI(
              api_key=os.environ["FOUNDRY_API_KEY"],
              base_url=os.environ["FOUNDRY_ENDPOINT"],
          )

          prompt = f"""
          You are a senior Test Automation Engineer.

          Review the pull request and determine whether a Playwright test is required.
          Documentation-only, markdown, README, and non-user-visible changes normally
          do not require Playwright tests.

          Return ONLY valid JSON with this shape:
          {{
            "test_required": true,
            "reason": "...",
            "test_name": "...",
            "test_description": "..."
          }}

          PR TITLE:
          {os.environ["PR_TITLE"]}

          PR DESCRIPTION:
          {os.environ["PR_BODY"]}

          CHANGED FILES:
          {changed_files}

          DIFF:
          {diff[:12000]}
          """

          response = client.responses.create(
              model=os.environ["FOUNDRY_MODEL_DEPLOYMENT"],
              input=prompt,
          )
          raw_result = response.output_text.strip()

          if not raw_result or raw_result.startswith("```"):
              raise RuntimeError("The model returned invalid test decision output.")

          try:
              decision = json.loads(raw_result)
          except json.JSONDecodeError as error:
              raise RuntimeError(f"Invalid test decision JSON: {error}") from error

          if not isinstance(decision, dict):
              raise RuntimeError("The test decision must be a JSON object.")
          if not isinstance(decision.get("test_required"), bool):
              raise RuntimeError("test_required must be a boolean.")
          if not isinstance(decision.get("reason"), str):
              raise RuntimeError("reason must be a string.")

          if decision["test_required"]:
              for field in ("test_name", "test_description"):
                  value = decision.get(field)
                  if not isinstance(value, str) or not value.strip():
                      raise RuntimeError(f"{field} must be a non-empty string.")

              if not re.fullmatch(r"[A-Za-z0-9_-]+", decision["test_name"]):
                  raise RuntimeError(
                      "test_name may contain only letters, numbers, underscores, and hyphens."
                  )

          with open("test-decision.json", "w", encoding="utf-8") as file:
              json.dump(decision, file, indent=2)

          print(json.dumps(decision, indent=2))
          EOF

      - name: Generate Playwright test if needed
        env:
          FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_ENDPOINT }}
          FOUNDRY_API_KEY: ${{ secrets.FOUNDRY_API_KEY }}
          FOUNDRY_MODEL_DEPLOYMENT: ${{ secrets.FOUNDRY_MODEL_DEPLOYMENT }}
        run: |
          python <<'EOF'
          import json
          import os
          from pathlib import Path

          from openai import OpenAI

          decision = json.loads(Path("test-decision.json").read_text(encoding="utf-8"))

          if not decision["test_required"]:
              Path("test-agent-review.md").write_text(
                  "## Test Automation Agent\n\n"
                  "No Playwright test required.\n\n"
                  f"Reason: {decision['reason']}\n",
                  encoding="utf-8",
              )
              print("No test generation needed.")
              raise SystemExit(0)

          diff = Path("pr.diff").read_text(encoding="utf-8")
          client = OpenAI(
              api_key=os.environ["FOUNDRY_API_KEY"],
              base_url=os.environ["FOUNDRY_ENDPOINT"],
          )

          prompt = f"""
          You are a senior Playwright engineer.
          Generate a complete JavaScript Playwright test file.

          TEST DESCRIPTION:
          {decision["test_description"]}

          IMPLEMENTATION DIFF:
          {diff[:12000]}

          Return ONLY JavaScript source code. Do not use explanations or Markdown fences.
          """

          response = client.responses.create(
              model=os.environ["FOUNDRY_MODEL_DEPLOYMENT"],
              input=prompt,
          )
          generated_content = response.output_text.strip()

          if not generated_content or generated_content.startswith("```"):
              raise RuntimeError("The model returned invalid Playwright test output.")

          test_directory = Path("tests/specs")
          test_directory.mkdir(parents=True, exist_ok=True)
          test_file = test_directory / f"{decision['test_name']}.spec.js"
          test_file.write_text(generated_content + "\n", encoding="utf-8")

          Path("test-agent-review.md").write_text(
              "## Test Automation Agent\n\n"
              "Playwright test generated.\n\n"
              f"Reason: {decision['reason']}\n"
              f"Generated test: {test_file}\n",
              encoding="utf-8",
          )

          print(f"Generated: {test_file}")
          EOF

      - name: Commit generated tests to a separate branch
        if: steps.repository.outputs.same-repository == 'true'
        id: generated-branch
        run: |
          if ! git diff --quiet -- tests/specs; then
            git config user.name "PetriTestAgent"
            git config user.email "petrialapiessa-test-2026@hotmail.com"

            branch="test-agent/pr-${{ steps.pr.outputs.number }}-${GITHUB_RUN_ID}"
            git checkout -b "$branch"
            git add tests/specs/
            git commit -m "Test Agent: generate Playwright tests"
            git push --set-upstream origin "$branch"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "No generated tests to commit."
          fi

      - name: Create generated-tests pull request
        if: steps.repository.outputs.same-repository == 'true' && steps.generated-branch.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base "${{ steps.pr.outputs.base-ref }}" \
            --head "${{ steps.generated-branch.outputs.branch }}" \
            --title "Test Agent: generated tests for #${{ steps.pr.outputs.number }}" \
            --body-file test-agent-review.md

      - name: Comment on source PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            {
              echo "testing purposes"
              echo
              cat test-agent-review.md
            } > pr-comment.md
          else
            cp test-agent-review.md pr-comment.md
          fi

          gh pr comment "${{ steps.pr.outputs.number }}" \
            --body-file pr-comment.md
