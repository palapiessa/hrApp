name: Developer Agent - Issue Analysis

on:
  workflow_dispatch:
    inputs:
      issue_title:
        description: "Issue title"
        required: true
        type: string

      issue_description:
        description: "Issue description"
        required: true
        type: string

permissions:
  contents: read

jobs:
  analyze-issue:
    runs-on: ubuntu-latest

    environment: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenAI SDK
        run: pip install openai

      - name: Verify Foundry secrets
        env:
          FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_ENDPOINT }}
          FOUNDRY_API_KEY: ${{ secrets.FOUNDRY_API_KEY }}
          FOUNDRY_MODEL_DEPLOYMENT: ${{ secrets.FOUNDRY_MODEL_DEPLOYMENT }}
        run: |
          [ -n "$FOUNDRY_API_KEY" ] && echo "FOUNDRY_API_KEY found" || echo "FOUNDRY_API_KEY missing"
          [ -n "$FOUNDRY_ENDPOINT" ] && echo "FOUNDRY_ENDPOINT found" || echo "FOUNDRY_ENDPOINT missing"
          [ -n "$FOUNDRY_MODEL_DEPLOYMENT" ] && echo "FOUNDRY_MODEL_DEPLOYMENT found" || echo "FOUNDRY_MODEL_DEPLOYMENT missing"

      - name: Analyze task with Azure AI Foundry
        env:
          FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_ENDPOINT }}
          FOUNDRY_API_KEY: ${{ secrets.FOUNDRY_API_KEY }}
          FOUNDRY_MODEL_DEPLOYMENT: ${{ secrets.FOUNDRY_MODEL_DEPLOYMENT }}

          ISSUE_TITLE: ${{ github.event.inputs.issue_title }}
          ISSUE_BODY: ${{ github.event.inputs.issue_description }}

        run: |
          python <<'EOF'
          import os
          from openai import OpenAI

          print("Endpoint:", os.environ["FOUNDRY_ENDPOINT"])
          print("Deployment:", os.environ["FOUNDRY_MODEL_DEPLOYMENT"])

          client = OpenAI(
              api_key=os.environ["FOUNDRY_API_KEY"],
              base_url=os.environ["FOUNDRY_ENDPOINT"]
          )

          prompt = f"""
          You are the Developer Agent of a software development team.

          Analyze the following task and provide:

          1. Summary
          2. Proposed implementation approach
          3. Affected files (best guess)
          4. Suggested tests
          5. Risks or assumptions

          TASK TITLE:
          {os.environ['ISSUE_TITLE']}

          TASK DESCRIPTION:
          {os.environ['ISSUE_BODY']}
          """

          response = client.responses.create(
            model=os.environ["FOUNDRY_MODEL_DEPLOYMENT"],
            input=prompt
          )

          analysis = response.output_text

          print("\n=== AI ANALYSIS ===\n")
          print(analysis)

          with open("analysis.md", "w") as f:
            f.write("# Developer Agent Analysis\n\n")
            f.write(analysis)
