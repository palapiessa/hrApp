name: Developer Agent - Modify Files

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number"
        required: true

      file_path:
        description: "File selected by planning agent"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  modify-file:
    runs-on: ubuntu-latest

    environment: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OpenAI SDK
        run: |
          pip install openai

      - name: Validate file type
        env:
          FILE_PATH: ${{ github.event.inputs.file_path }}
        run: |

          if [[ ! "$FILE_PATH" =~ \.md$ ]]; then
            echo "Only markdown files are allowed in v1."
            exit 1
          fi

      - name: Read target file
        env:
          FILE_PATH: ${{ github.event.inputs.file_path }}
        run: |
          cat "$FILE_PATH" > target_file.txt

      - name: Modify file with Developer Agent
        env:
          FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_ENDPOINT }}
          FOUNDRY_API_KEY: ${{ secrets.FOUNDRY_API_KEY }}
          FOUNDRY_MODEL_DEPLOYMENT: ${{ secrets.FOUNDRY_MODEL_DEPLOYMENT }}

          FILE_PATH: ${{ github.event.inputs.file_path }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}

        run: |
          python <<'EOF'
          import os
          from openai import OpenAI

          client = OpenAI(
              api_key=os.environ["FOUNDRY_API_KEY"],
              base_url=os.environ["FOUNDRY_ENDPOINT"]
          )

          with open(
              "target_file.txt",
              "r",
              encoding="utf-8"
          ) as f:
              file_content = f.read()

          prompt = f"""
          You are the Developer Agent.

          The selected repository file is:

          {os.environ['FILE_PATH']}

          Current file content:

          -------------------
          {file_content}
          -------------------

          Update the file according to Issue #{os.environ['ISSUE_NUMBER']}.

          Return ONLY the complete updated file.

          Do not include explanations.
          Do not use markdown code fences.
          """

          response = client.responses.create(
              model=os.environ["FOUNDRY_MODEL_DEPLOYMENT"],
              input=prompt
          )

          updated_content = response.output_text

          with open(
              os.environ["FILE_PATH"],
              "w",
              encoding="utf-8"
          ) as f:
              f.write(updated_content)

          print("Updated:", os.environ["FILE_PATH"])

          EOF

      - name: Configure Git
        run: |
          git config user.name "PetriDevAgent"
          git config user.email "petri.dev.agent@gmail.com"

      - name: Create branch
        env:
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        run: |
          BRANCH="devagent/issue-${ISSUE_NUMBER}-implementation"

          git checkout -b "$BRANCH"

          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Commit changes
        env:
          FILE_PATH: ${{ github.event.inputs.file_path }}
        run: |
          git add "$FILE_PATH"

          git commit \
            -m "Developer Agent: implement issue update"

      - name: Push branch
        run: |
          git push origin "$BRANCH"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        run: |
          gh pr create \
            --head "$BRANCH" \
            --base main \
            --title "Developer Agent: Implementation for Issue #${ISSUE_NUMBER}" \
            --body "
          Automated implementation generated by Developer Agent.

          Issue:
          #${ISSUE_NUMBER}

          This PR modifies:
          - ${{ github.event.inputs.file_path }}
          "