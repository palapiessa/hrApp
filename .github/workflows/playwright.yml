name: Playwright Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tests/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright dependencies
        working-directory: tests
        run: npm ci

      - name: Install Playwright browser
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Start JSON Server
        if: ${{ !vars.PLAYWRIGHT_BASE_URL }}
        working-directory: web
        run: |
          npm run server > "$RUNNER_TEMP/json-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/json-server.pid"
          
  
      - name: Show target URL
        run: |
          echo "PLAYWRIGHT_BASE_URL=$PLAYWRIGHT_BASE_URL"
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
            
      - name: Run Playwright tests
        working-directory: tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 14
      
      - name: Upload Playwright videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: tests/test-results/
          retention-days: 14
          
      - name: Upload JSON Server log
        if: ${{ always() && !vars.PLAYWRIGHT_BASE_URL }}
        uses: actions/upload-artifact@v4
        with:
          name: json-server-log
          path: ${{ runner.temp }}/json-server.log
          retention-days: 14
